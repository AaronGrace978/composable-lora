# Notes for training against real SDXL/Flux base models.
#
# clora.train only implements the offline CPU toy path today (see
# train_toy.yaml / train_composable.yaml and ROADMAP.md milestone 2). For
# real base models, use clora.hf_models directly to load a UNet2DConditionModel
# / FluxTransformer2DModel via diffusers and wrap it with peft's LoraConfig
# (see clora.hf_models.inject_peft_lora / extract_peft_lora_weights), then
# adapt the training loop in clora.train.train() to use a real dataset,
# text encoder, and noise scheduler instead of the synthetic toy data.
#
# base_model: stabilityai/stable-diffusion-xl-base-1.0   # or black-forest-labs/FLUX.1-dev
# rank: 32
# alpha: 32
# target_modules: [to_q, to_k, to_v, to_out.0]
